name: Sync Cobalt Repository

on:
  schedule:
    - cron: "0 0 * * *" # Каждый день в полночь
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout your repository
        uses: actions/checkout@v4
        with:
          repository: vberin/my-cobalt-bot
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Pull updates from Cobalt
        run: |
          git remote add cobalt https://github.com/imputnet/cobalt.git
          git fetch cobalt
          git checkout main
          git merge cobalt/main --allow-unrelated-histories --strategy-option=theirs
          git push origin main